<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRAXIS</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --border: #e5e5e5;
      --accent: #272727;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .app {
      max-width: 860px;
      margin: 0 auto;
      padding: 22px 16px 34px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .nav a {
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.9rem;
      background: #fff;
    }

    .nav a.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .screen {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
    }

    .screen.active {
      display: block;
    }

    h1, h2 {
      margin: 0;
      font-size: 1.4rem;
    }

    .subtitle {
      margin: 8px 0 16px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.93rem;
    }

    textarea,
    select,
    input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .row {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .controls {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      margin-bottom: 12px;
    }

    .button {
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      padding: 10px 14px;
      margin-top: 12px;
    }

    .button[disabled] {
      opacity: 0.6;
      cursor: default;
    }

    .button.secondary {
      background: #ececea;
      color: #333;
      border: 1px solid #e2e2df;
    }

    .notice {
      margin-top: 10px;
      border: 1px solid var(--border);
      background: #f2f2f0;
      color: #4c4c4c;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      display: none;
    }

    .notice.visible {
      display: block;
    }

    .cards {
      margin-top: 14px;
      display: grid;
      gap: 10px;
      grid-template-columns: 1fr;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fcfcfc;
      padding: 12px;
    }

    .card strong {
      font-size: 0.86rem;
      color: #4d4d4d;
      display: block;
      margin-bottom: 4px;
    }

    .history-item {
      margin-bottom: 10px;
    }

    .meta {
      color: var(--muted);
      font-size: 0.84rem;
      margin-top: 8px;
    }

    .badge {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.77rem;
      margin-right: 6px;
      margin-bottom: 8px;
      color: #555;
    }

    .empty {
      color: var(--muted);
      font-size: 0.94rem;
      margin: 4px 0;
    }

    details {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fcfcfc;
      margin-bottom: 8px;
    }

    summary {
      cursor: pointer;
      font-size: 0.92rem;
      color: #444;
    }

    .loading::after {
      content: ' ...';
      animation: blink 1s infinite;
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      50% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    @media (max-width: 760px) {
      .row,
      .controls {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <circle cx="9" cy="9" r="7" stroke="#262626" stroke-width="1.4" />
          <circle cx="9" cy="9" r="2" fill="#262626" />
        </svg>
        <span>PRAXIS</span>
      </div>
      <nav class="nav">
        <a href="#/home" data-nav="home">Início</a>
        <a href="#/history" data-nav="history">Histórico</a>
        <a href="#/review" data-nav="review">Revisão Semanal</a>
      </nav>
    </header>

    <section id="screen-home" class="screen">
      <h1>PRAXIS</h1>
      <p class="subtitle">Transformar conhecimento em ação prática.</p>

      <label for="inputLearned">O que você aprendeu?</label>
      <textarea id="inputLearned"></textarea>

      <label for="inputArea">Área da Vida</label>
      <select id="inputArea" required>
        <option value="">Selecione uma área</option>
        <option>Espiritualidade</option>
        <option>Identidade</option>
        <option>Energia & Ritmo</option>
        <option>Trabalho & Provisão</option>
        <option>Relacionamento</option>
      </select>

      <button id="generateBtn" class="button" type="button">Transformar em Ação</button>
      <div id="homeNotice" class="notice"></div>

      <div id="resultCards" class="cards" style="display:none;">
        <article class="card"><strong>Ação</strong><span id="resAcao"></span></article>
        <article class="card"><strong>Prazo</strong><span id="resPrazo"></span></article>
        <article class="card"><strong>Regra mínima</strong><span id="resRegra"></span></article>
      </div>
    </section>

    <section id="screen-history" class="screen">
      <h2>Histórico</h2>
      <p class="subtitle">Acompanhe e conclua suas ações.</p>

      <div class="controls">
        <select id="filterArea">
          <option value="">Área: Todas</option>
          <option>Espiritualidade</option>
          <option>Identidade</option>
          <option>Energia & Ritmo</option>
          <option>Trabalho & Provisão</option>
          <option>Relacionamento</option>
        </select>

        <select id="filterStatus">
          <option value="all">Status: Todos</option>
          <option value="pendente">Pendentes</option>
          <option value="feito">Concluídos</option>
        </select>

        <input id="filterQuery" type="text" placeholder="Buscar por texto" />

        <select id="filterSort">
          <option value="recent">Mais recentes</option>
          <option value="deadline">Prazo mais próximo</option>
        </select>
      </div>

      <div id="historyList"></div>
    </section>

    <section id="screen-review" class="screen">
      <h2>Revisão Semanal</h2>
      <p class="subtitle">Fechar ciclo com clareza.</p>

      <div class="row">
        <div>
          <label for="rev1">1) O que executei?</label>
          <textarea id="rev1"></textarea>
        </div>
        <div>
          <label for="rev2">2) O que trouxe paz?</label>
          <textarea id="rev2"></textarea>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="rev3">3) O que gerou peso?</label>
          <textarea id="rev3"></textarea>
        </div>
        <div>
          <label for="rev4">4) O que deve sair?</label>
          <textarea id="rev4"></textarea>
        </div>
      </div>

      <button id="saveReviewBtn" class="button" type="button">Salvar revisão</button>
      <div id="reviewNotice" class="notice"></div>

      <div id="reviewList" style="margin-top:14px;"></div>
    </section>
  </main>

  <script>
    const screens = {
      home: document.getElementById('screen-home'),
      history: document.getElementById('screen-history'),
      review: document.getElementById('screen-review')
    };

    const state = {
      history: [],
      pendingCount: 0
    };

    const ui = {
      navLinks: Array.from(document.querySelectorAll('[data-nav]')),
      generateBtn: document.getElementById('generateBtn'),
      inputLearned: document.getElementById('inputLearned'),
      inputArea: document.getElementById('inputArea'),
      homeNotice: document.getElementById('homeNotice'),
      resultCards: document.getElementById('resultCards'),
      resAcao: document.getElementById('resAcao'),
      resPrazo: document.getElementById('resPrazo'),
      resRegra: document.getElementById('resRegra'),
      filterArea: document.getElementById('filterArea'),
      filterStatus: document.getElementById('filterStatus'),
      filterQuery: document.getElementById('filterQuery'),
      filterSort: document.getElementById('filterSort'),
      historyList: document.getElementById('historyList'),
      saveReviewBtn: document.getElementById('saveReviewBtn'),
      reviewNotice: document.getElementById('reviewNotice'),
      reviewList: document.getElementById('reviewList'),
      rev1: document.getElementById('rev1'),
      rev2: document.getElementById('rev2'),
      rev3: document.getElementById('rev3'),
      rev4: document.getElementById('rev4')
    };

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function sanitize(text) {
      return String(text || '').replace(/\s+/g, ' ').trim();
    }

    function showNotice(el, message) {
      el.textContent = message;
      el.classList.add('visible');
    }

    function hideNotice(el) {
      el.textContent = '';
      el.classList.remove('visible');
    }

    function getRoute() {
      const route = location.hash.replace('#/', '');
      if (route === 'history' || route === 'review') {
        return route;
      }
      return 'home';
    }

    function renderRoute() {
      const route = getRoute();
      Object.entries(screens).forEach(([key, node]) => {
        node.classList.toggle('active', key === route);
      });
      ui.navLinks.forEach((link) => {
        link.classList.toggle('active', link.dataset.nav === route);
      });
    }

    async function requestJson(url, options = {}) {
      const res = await fetch(url, options);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) {
        const error = new Error(data.message || 'Erro de comunicação');
        error.status = res.status;
        error.payload = data;
        throw error;
      }
      return data;
    }

    function renderHomeGate() {
      const blocked = state.pendingCount >= 2;
      ui.generateBtn.disabled = blocked;
      if (blocked) {
        showNotice(ui.homeNotice, 'Você já tem 2 ações pendentes. Conclua 1 para gerar outra.');
      } else {
        hideNotice(ui.homeNotice);
      }
    }

    function renderHistory() {
      let items = [...state.history];
      const area = ui.filterArea.value;
      const status = ui.filterStatus.value;
      const query = sanitize(ui.filterQuery.value).toLowerCase();
      const sort = ui.filterSort.value;

      if (area) {
        items = items.filter((item) => item.area === area);
      }

      if (status !== 'all') {
        items = items.filter((item) => item.status === status);
      }

      if (query) {
        items = items.filter((item) => {
          const hay = `${item.texto} ${item.acao} ${item.prazo}`.toLowerCase();
          return hay.includes(query);
        });
      }

      if (sort === 'deadline') {
        items.sort((a, b) => new Date(a.prazo_iso) - new Date(b.prazo_iso));
      } else {
        items.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
      }

      if (!items.length) {
        ui.historyList.innerHTML =
          '<p class="empty">Nenhuma ação ainda. Gere sua primeira ação na tela Início.</p>';
        return;
      }

      ui.historyList.innerHTML = items
        .map((item) => {
          const statusLabel = item.status === 'feito' ? 'concluído' : 'pendente';
          const actionLabel = item.status === 'feito' ? 'Reabrir' : 'Concluir';
          const nextStatus = item.status === 'feito' ? 'pendente' : 'feito';
          return `
            <article class="card history-item">
              <span class="badge">${escapeHtml(item.area)}</span>
              <span class="badge">${escapeHtml(statusLabel)}</span>
              <div>${escapeHtml(item.acao)}</div>
              <div class="meta">Prazo: ${escapeHtml(item.prazo)}</div>
              <div class="meta">Criado em: ${escapeHtml(new Date(item.created_at).toLocaleString('pt-BR'))}</div>
              <button class="button secondary" data-action="toggle-status" data-id="${item.id}" data-status="${nextStatus}">${actionLabel}</button>
            </article>
          `;
        })
        .join('');
    }

    async function refreshHistoryAndMeta() {
      const [history, meta] = await Promise.all([
        requestJson('/api/history'),
        requestJson('/api/meta')
      ]);
      state.history = Array.isArray(history) ? history : [];
      state.pendingCount = Number(meta?.pendentes || 0);
      renderHomeGate();
      renderHistory();
    }

    async function generateAction() {
      const input = sanitize(ui.inputLearned.value);
      const area = sanitize(ui.inputArea.value);

      if (!input) {
        showNotice(ui.homeNotice, 'Escreva o que você aprendeu para gerar uma ação.');
        return;
      }

      if (!area) {
        showNotice(ui.homeNotice, 'Selecione a Área da Vida para continuar.');
        return;
      }

      ui.generateBtn.disabled = true;
      ui.generateBtn.classList.add('loading');

      try {
        const data = await requestJson('/api/praxis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input, area })
        });

        hideNotice(ui.homeNotice);
        ui.resAcao.textContent = data.acao;
        ui.resPrazo.textContent = data.prazo;
        ui.resRegra.textContent = data.regraMinima || data.regra_minima;
        ui.resultCards.style.display = 'grid';

        if (data.warning) {
          showNotice(ui.homeNotice, data.warning);
        }

        ui.inputLearned.value = '';
        await refreshHistoryAndMeta();
      } catch (error) {
        if (error.status === 409 && error.payload?.error === 'limite_pendentes') {
          showNotice(ui.homeNotice, error.payload.message);
          await refreshHistoryAndMeta();
          return;
        }

        if (String(error.payload?.message || '').includes('formato inválido')) {
          showNotice(ui.homeNotice, 'Não entendi a resposta da IA — gere novamente.');
          return;
        }

        showNotice(ui.homeNotice, 'Não foi possível gerar a ação agora. Tente novamente.');
      } finally {
        ui.generateBtn.classList.remove('loading');
        renderHomeGate();
      }
    }

    async function toggleStatus(id, status, button) {
      button.disabled = true;
      button.classList.add('loading');
      try {
        await requestJson(`/api/history/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status })
        });
        await refreshHistoryAndMeta();
      } catch (_error) {
        alert('Não foi possível atualizar este item agora.');
      } finally {
        button.classList.remove('loading');
      }
    }

    function renderReviews(items) {
      const limited = (Array.isArray(items) ? items : []).slice(0, 10);
      if (!limited.length) {
        ui.reviewList.innerHTML = '<p class="empty">Nenhuma revisão registrada ainda.</p>';
        return;
      }

      ui.reviewList.innerHTML = limited
        .map((item) => `
          <details>
            <summary>${escapeHtml(new Date(item.created_at).toLocaleString('pt-BR'))}</summary>
            <p><strong>1) O que executei?</strong><br>${escapeHtml(item.respostas?.executei)}</p>
            <p><strong>2) O que trouxe paz?</strong><br>${escapeHtml(item.respostas?.trouxe_paz)}</p>
            <p><strong>3) O que gerou peso?</strong><br>${escapeHtml(item.respostas?.gerou_peso)}</p>
            <p><strong>4) O que deve sair?</strong><br>${escapeHtml(item.respostas?.deve_sair)}</p>
          </details>
        `)
        .join('');
    }

    async function loadReviews() {
      try {
        const items = await requestJson('/api/weekly-reviews');
        renderReviews(items);
      } catch (_error) {
        ui.reviewList.innerHTML = '<p class="empty">Erro ao carregar revisões.</p>';
      }
    }

    async function saveReview() {
      const respostas = {
        executei: sanitize(ui.rev1.value),
        trouxe_paz: sanitize(ui.rev2.value),
        gerou_peso: sanitize(ui.rev3.value),
        deve_sair: sanitize(ui.rev4.value)
      };

      if (!respostas.executei || !respostas.trouxe_paz || !respostas.gerou_peso || !respostas.deve_sair) {
        showNotice(ui.reviewNotice, 'Preencha as 4 respostas antes de salvar.');
        return;
      }

      ui.saveReviewBtn.disabled = true;
      ui.saveReviewBtn.classList.add('loading');

      try {
        await requestJson('/api/weekly-reviews', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ respostas })
        });
        hideNotice(ui.reviewNotice);
        ui.rev1.value = '';
        ui.rev2.value = '';
        ui.rev3.value = '';
        ui.rev4.value = '';
        await loadReviews();
      } catch (_error) {
        showNotice(ui.reviewNotice, 'Não foi possível salvar a revisão agora.');
      } finally {
        ui.saveReviewBtn.classList.remove('loading');
        ui.saveReviewBtn.disabled = false;
      }
    }

    ui.generateBtn.addEventListener('click', generateAction);
    ui.filterArea.addEventListener('change', renderHistory);
    ui.filterStatus.addEventListener('change', renderHistory);
    ui.filterSort.addEventListener('change', renderHistory);
    ui.filterQuery.addEventListener('input', renderHistory);

    ui.historyList.addEventListener('click', (event) => {
      const target = event.target;
      if (!(target instanceof HTMLButtonElement)) {
        return;
      }

      if (target.dataset.action === 'toggle-status') {
        toggleStatus(target.dataset.id, target.dataset.status, target);
      }
    });

    ui.saveReviewBtn.addEventListener('click', saveReview);
    window.addEventListener('hashchange', renderRoute);

    (async () => {
      if (!location.hash) {
        location.hash = '#/home';
      }
      renderRoute();
      await refreshHistoryAndMeta();
      await loadReviews();
    })();
  </script>
</body>
</html>
