<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PRAXIS</title>
  <style>
    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --text: #1f1f1f;
      --muted: #6b6b6b;
      --border: #e7e7e7;
      --accent: #1f1f1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
    }

    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 8px 0 20px;
      color: var(--muted);
      font-size: 0.98rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font: inherit;
      color: var(--text);
      background: #fff;
    }

    textarea:focus {
      outline: 2px solid #d7d7d7;
      outline-offset: 1px;
    }

    button {
      margin-top: 14px;
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      background: var(--accent);
      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.92;
    }

    .result {
      margin-top: 22px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
      display: none;
      gap: 12px;
    }

    .result.visible {
      display: grid;
    }

    .item {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fcfcfc;
    }

    .item strong {
      display: block;
      margin-bottom: 4px;
      font-size: 0.92rem;
      color: #3b3b3b;
    }

    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .row button {
      margin-top: 0;
      padding: 8px 12px;
      font-size: 0.9rem;
    }

    .history {
      margin-top: 22px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
      display: grid;
      gap: 10px;
    }

    .history h2 {
      margin: 0 0 2px;
      font-size: 1.1rem;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 8px;
    }

    .toolbar select {
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
      background: #fff;
      color: var(--text);
    }

    .toolbar .light-button {
      background: #efefef;
      color: #2f2f2f;
      border: 1px solid #e3e3e3;
      margin-top: 0;
    }

    .history-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fcfcfc;
      padding: 12px;
    }

    .history-item p {
      margin: 0 0 8px;
      font-size: 0.95rem;
    }

    .history-meta {
      color: var(--muted);
      font-size: 0.86rem;
      margin-top: 8px;
    }

    .notice {
      margin-top: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #f4f4f3;
      color: #4b4b4b;
      font-size: 0.92rem;
      display: none;
    }

    .area-badge {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 2px 8px;
      font-size: 0.78rem;
      color: #5a5a5a;
      margin-bottom: 8px;
      margin-right: 6px;
    }

    .status {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.78rem;
      color: #4a4a4a;
      margin-bottom: 8px;
    }

    .history-empty {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }

    .upcoming-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .upcoming-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: #fcfcfc;
    }

    .upcoming-box h3 {
      margin: 0 0 10px;
      font-size: 0.92rem;
    }

    .upcoming-box p {
      margin: 0 0 8px;
      font-size: 0.9rem;
    }

    .review-form {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fcfcfc;
      padding: 12px;
      display: none;
      gap: 10px;
    }

    .review-form.visible {
      display: grid;
    }

    .review-form textarea {
      min-height: 74px;
    }

    .review-list details {
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fcfcfc;
      padding: 10px 12px;
      margin-top: 8px;
    }

    .review-list summary {
      cursor: pointer;
      color: #3d3d3d;
      font-size: 0.92rem;
    }

    .review-list p {
      margin: 8px 0;
      font-size: 0.92rem;
    }

    .tag {
      display: inline-block;
      border-radius: 999px;
      border: 1px solid var(--border);
      padding: 2px 8px;
      font-size: 0.78rem;
      margin-right: 6px;
      margin-top: 4px;
      color: #5a5a5a;
    }

    @media (max-width: 640px) {
      .app {
        padding: 14px;
      }

      .card {
        padding: 16px;
        border-radius: 12px;
      }

      h1 {
        font-size: 1.45rem;
      }

      textarea {
        min-height: 120px;
      }

      button {
        width: 100%;
      }

      .upcoming-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card">
      <h1>PRAXIS</h1>
      <p class="subtitle">Transformar conhecimento em ação prática.</p>

      <label for="learnedInput">O que você aprendeu?</label>
      <textarea id="learnedInput" placeholder="Ex.: Aprendi que dividir tarefas grandes em blocos de 25 minutos melhora meu foco."></textarea>
      <button id="transformBtn" type="button">Transformar em Ação</button>
      <div id="notice" class="notice"></div>

      <div id="result" class="result" aria-live="polite">
        <div class="item">
          <strong>Ação prática simples</strong>
          <span id="actionText"></span>
        </div>
        <div class="item">
          <strong>Prazo</strong>
          <span id="deadlineText"></span>
        </div>
        <div class="item">
          <strong>Regra de execução mínima</strong>
          <span id="ruleText"></span>
        </div>
        <div class="item" id="tagsWrap" style="display: none;">
          <strong>Tags</strong>
          <div id="tagsText"></div>
        </div>
      </div>

      <section class="history">
        <h2>Histórico</h2>
        <div class="toolbar">
          <select id="areaFilter">
            <option value="">Todas as áreas</option>
            <option value="Espiritualidade">Espiritualidade</option>
            <option value="Identidade">Identidade</option>
            <option value="Energia & Ritmo">Energia & Ritmo</option>
            <option value="Trabalho & Provisão">Trabalho & Provisão</option>
            <option value="Relacionamento">Relacionamento</option>
          </select>
          <button id="weeklyReviewBtn" type="button" class="light-button">Revisão da Semana</button>
        </div>
        <div id="historyList"></div>
      </section>

      <section class="history">
        <h2>Próximos prazos (24h/7d)</h2>
        <div class="upcoming-grid">
          <div class="upcoming-box">
            <h3>Nas próximas 24h</h3>
            <div id="upcoming24"></div>
          </div>
          <div class="upcoming-box">
            <h3>Nos próximos 7 dias</h3>
            <div id="upcoming7d"></div>
          </div>
        </div>
      </section>

      <section class="history">
        <h2>Revisões Semanais</h2>
        <div id="weeklyReviewForm" class="review-form">
          <label for="reviewExecutei">1) O que executei?</label>
          <textarea id="reviewExecutei"></textarea>

          <label for="reviewPaz">2) O que trouxe paz?</label>
          <textarea id="reviewPaz"></textarea>

          <label for="reviewPeso">3) O que gerou peso?</label>
          <textarea id="reviewPeso"></textarea>

          <label for="reviewSair">4) O que deve sair?</label>
          <textarea id="reviewSair"></textarea>

          <div class="row">
            <button id="saveWeeklyReviewBtn" type="button">Salvar revisão</button>
            <button id="cancelWeeklyReviewBtn" type="button" class="light-button">Fechar</button>
          </div>
        </div>
        <div id="weeklyReviewsList" class="review-list"></div>
      </section>
    </section>
  </main>

  <script>
    const learnedInput = document.getElementById('learnedInput');
    const transformBtn = document.getElementById('transformBtn');
    const result = document.getElementById('result');
    const actionText = document.getElementById('actionText');
    const deadlineText = document.getElementById('deadlineText');
    const ruleText = document.getElementById('ruleText');
    const tagsWrap = document.getElementById('tagsWrap');
    const tagsText = document.getElementById('tagsText');
    const historyList = document.getElementById('historyList');
    const upcoming24 = document.getElementById('upcoming24');
    const upcoming7d = document.getElementById('upcoming7d');
    const notice = document.getElementById('notice');
    const areaFilter = document.getElementById('areaFilter');
    const weeklyReviewBtn = document.getElementById('weeklyReviewBtn');
    const weeklyReviewForm = document.getElementById('weeklyReviewForm');
    const saveWeeklyReviewBtn = document.getElementById('saveWeeklyReviewBtn');
    const cancelWeeklyReviewBtn = document.getElementById('cancelWeeklyReviewBtn');
    const weeklyReviewsList = document.getElementById('weeklyReviewsList');
    const reviewExecutei = document.getElementById('reviewExecutei');
    const reviewPaz = document.getElementById('reviewPaz');
    const reviewPeso = document.getElementById('reviewPeso');
    const reviewSair = document.getElementById('reviewSair');

    let historyCache = [];

    function sanitizeText(text) {
      return text.replace(/\s+/g, ' ').trim();
    }

    function escapeHtml(text) {
      return String(text || '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function showNotice(message) {
      notice.textContent = message;
      notice.style.display = 'block';
    }

    function hideNotice() {
      notice.style.display = 'none';
      notice.textContent = '';
    }

    function renderHistory(items) {
      const selectedArea = areaFilter.value;
      const filteredItems = selectedArea
        ? items.filter((item) => item.area === selectedArea)
        : items;

      if (!filteredItems.length) {
        historyList.innerHTML = '<p class="history-empty">Nenhum item para este filtro.</p>';
        return;
      }

      historyList.innerHTML = filteredItems
        .map((item) => {
          const acao = item.acao || item.acao_pratica || '';
          const prazo = item.prazo || item.prazo_humano || '';
          const regra = item.regraMinima || item.regra_minima || '';
          const isDone = item.status === 'feito' || item.status === 'concluido';
          return `
            <article class="history-item">
              <span class="area-badge">${escapeHtml(item.area || 'Energia & Ritmo')}</span>
              <span class="status">${item.status}</span>
              <p><strong>Aprendizado:</strong> ${escapeHtml(item.texto)}</p>
              <p><strong>Ação:</strong> ${escapeHtml(acao)}</p>
              <p><strong>Prazo:</strong> ${escapeHtml(prazo)}</p>
              <p><strong>Regra mínima:</strong> ${escapeHtml(regra)}</p>
              <div class="row">
                <button type="button" data-action="complete" data-id="${item.id}" ${isDone ? 'disabled' : ''}>
                  ${isDone ? 'Feito' : 'Concluir'}
                </button>
                <button type="button" data-action="copy" data-id="${item.id}">Copiar ação</button>
              </div>
              <div class="history-meta">Criado em ${escapeHtml(item.created_at)}</div>
            </article>
          `;
        })
        .join('');
    }

    async function loadHistory() {
      try {
        const res = await fetch('/api/history');
        if (!res.ok) {
          throw new Error('Falha ao carregar histórico');
        }

        historyCache = await res.json();
        renderHistory(historyCache);
      } catch (_error) {
        historyList.innerHTML = '<p class="history-empty">Erro ao carregar histórico.</p>';
      }
    }

    async function loadUpcoming(windowValue, targetEl) {
      try {
        const res = await fetch(`/api/upcoming?window=${windowValue}`);
        if (!res.ok) {
          throw new Error('Falha ao carregar próximos prazos');
        }

        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if (!items.length) {
          targetEl.innerHTML = '<p class="history-empty">Sem prazos no período.</p>';
          return;
        }

        targetEl.innerHTML = items
          .slice(0, 5)
          .map((item) => {
            const prazo = item.prazo || item.prazo_humano || '';
            const acao = item.acao || item.acao_pratica || '';
            return `<p><strong>${escapeHtml(prazo)}</strong><br>${escapeHtml(acao)}</p>`;
          })
          .join('');
      } catch (_error) {
        targetEl.innerHTML = '<p class="history-empty">Erro ao carregar.</p>';
      }
    }

    function renderWeeklyReviews(items) {
      if (!Array.isArray(items) || !items.length) {
        weeklyReviewsList.innerHTML = '<p class="history-empty">Sem revisões ainda.</p>';
        return;
      }

      weeklyReviewsList.innerHTML = items
        .map((item) => `
          <details>
            <summary>${new Date(item.created_at).toLocaleString('pt-BR')}</summary>
            <p><strong>O que executei?</strong><br>${escapeHtml(item.respostas?.executei || '')}</p>
            <p><strong>O que trouxe paz?</strong><br>${escapeHtml(item.respostas?.trouxe_paz || '')}</p>
            <p><strong>O que gerou peso?</strong><br>${escapeHtml(item.respostas?.gerou_peso || '')}</p>
            <p><strong>O que deve sair?</strong><br>${escapeHtml(item.respostas?.deve_sair || '')}</p>
          </details>
        `)
        .join('');
    }

    async function loadWeeklyReviews() {
      try {
        const res = await fetch('/api/weekly-reviews');
        if (!res.ok) {
          throw new Error('Falha ao carregar revisões');
        }
        const items = await res.json();
        renderWeeklyReviews(items);
      } catch (_error) {
        weeklyReviewsList.innerHTML = '<p class="history-empty">Erro ao carregar revisões.</p>';
      }
    }

    transformBtn.addEventListener('click', async () => {
      const learned = sanitizeText(learnedInput.value);

      if (!learned) {
        showNotice('Escreva um aprendizado específico para gerar uma ação.');
        return;
      }

      transformBtn.disabled = true;
      transformBtn.textContent = 'Gerando...';

      try {
        const res = await fetch('/api/praxis', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ input: learned })
        });

        if (res.status === 409) {
          const blocked = await res.json();
          showNotice(blocked.message || 'Conclua uma ação pendente antes de criar outra.');
          return;
        }

        if (!res.ok) {
          const payload = await res.json().catch(() => null);
          throw new Error(payload?.message || 'Falha ao gerar ação');
        }

        const data = await res.json();
        hideNotice();
        actionText.textContent = data.acao || data.acao_pratica || '';
        deadlineText.textContent = data.prazo;
        ruleText.textContent = data.regraMinima || data.regra_minima || '';
        tagsWrap.style.display = 'block';
        tagsText.innerHTML = `<span class="area-badge">${escapeHtml(data.area || 'Energia & Ritmo')}</span>`;

        result.classList.add('visible');
        learnedInput.value = '';
        await loadHistory();
        await Promise.all([loadUpcoming('24h', upcoming24), loadUpcoming('7d', upcoming7d)]);
      } catch (_error) {
        showNotice('Não foi possível gerar a ação agora. Tente novamente em instantes.');
      } finally {
        transformBtn.disabled = false;
        transformBtn.textContent = 'Transformar em Ação';
      }
    });

    historyList.addEventListener('click', async (event) => {
      const target = event.target;
      if (!(target instanceof HTMLButtonElement)) {
        return;
      }

      const action = target.dataset.action;
      const itemId = target.dataset.id;

      if (!action) {
        return;
      }

      if (action === 'complete' && itemId) {
        const res = await fetch(`/api/history/${itemId}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: 'feito' })
        });
        if (!res.ok) {
          showNotice('Não foi possível concluir o item agora.');
          return;
        }
        await loadHistory();
        await Promise.all([loadUpcoming('24h', upcoming24), loadUpcoming('7d', upcoming7d)]);
        return;
      }

      if (action === 'copy') {
        const text = historyCache.find((item) => String(item.id) === String(itemId))?.acao || '';
        if (text) {
          await navigator.clipboard.writeText(text);
          showNotice('Ação copiada.');
        }
      }
    });

    areaFilter.addEventListener('change', () => {
      renderHistory(historyCache);
    });

    weeklyReviewBtn.addEventListener('click', () => {
      weeklyReviewForm.classList.toggle('visible');
    });

    cancelWeeklyReviewBtn.addEventListener('click', () => {
      weeklyReviewForm.classList.remove('visible');
    });

    saveWeeklyReviewBtn.addEventListener('click', async () => {
      const payload = {
        respostas: {
          executei: sanitizeText(reviewExecutei.value),
          trouxe_paz: sanitizeText(reviewPaz.value),
          gerou_peso: sanitizeText(reviewPeso.value),
          deve_sair: sanitizeText(reviewSair.value)
        }
      };

      if (!payload.respostas.executei || !payload.respostas.trouxe_paz || !payload.respostas.gerou_peso || !payload.respostas.deve_sair) {
        showNotice('Preencha as 4 respostas da revisão da semana.');
        return;
      }

      const res = await fetch('/api/weekly-reviews', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (!res.ok) {
        showNotice('Não foi possível salvar a revisão agora.');
        return;
      }

      reviewExecutei.value = '';
      reviewPaz.value = '';
      reviewPeso.value = '';
      reviewSair.value = '';
      weeklyReviewForm.classList.remove('visible');
      hideNotice();
      await loadWeeklyReviews();
    });

    loadHistory();
    loadWeeklyReviews();
    loadUpcoming('24h', upcoming24);
    loadUpcoming('7d', upcoming7d);
  </script>
</body>
</html>
